[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "tokendiet"
version = "1.0.0"
description = "Context compressor for AI coding agents — knapsack log pruning (C++20 kernel, Python fallback), AST skeletons, cross-turn read dedup. CLI + MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["llm", "ai-agents", "context-compression", "token-optimization", "mcp", "claude-code", "coding-agents", "knapsack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
authors = [
    { name = "Nagarjuna Kamireddy", email = "sendemailtonagarjuna@gmail.com" },
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[project.urls]
Homepage = "https://github.com/nagarjunak-pixel/tokendiet"
Repository = "https://github.com/nagarjunak-pixel/tokendiet"
Issues = "https://github.com/nagarjunak-pixel/tokendiet/issues"
Changelog = "https://github.com/nagarjunak-pixel/tokendiet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.122.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
tokendiet = "tokendiet.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tokendiet"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tokendiet",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
